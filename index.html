<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Background</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: Arial, sans-serif;

      /* Clean gradient background */
      background: linear-gradient(135deg, #1e3c72, #2a5298);

      /* Center content */
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .content {
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 30px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>Welcome</h1>
    <p>Clean and simple background</p>
  </div>

</body>
</html>
